<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d2540">
<title>Meet up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1d2540;
    --page: #eceef6;
    --card: #ffffff;
    --line: #d9dcea;
    --muted: #5d647d;

    --free: #cdf2e1;      --free-edge: #1c8c63;   --free-ink: #0f5c40;
    --busy-a: #dfe2ec;    --busy-b: #d0d4e2;      --busy-ink: #5d647d;
    --ask: #ffd166;       --ask-soft: #fff6dc;    --ask-edge: #c98e00;   --ask-ink: #5a3d00;
    --qt-a: #d63f78;      --qt-b: #7d37a8;

    --kid-0: #1f6fd6;     --kid-1: #e0561b;
    --dawn: #f4a259;  --sky: #4aa3e8;  --dusk: #6a5bd6;

    --display: "Bricolage Grotesque", "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-family: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--night); -webkit-font-smoothing: antialiased; }
  button { font: inherit; }

  /* --- Buttons --- */
  .btn {
    font-weight: 600; font-size: 15px; padding: 11px 18px; border-radius: 12px; border: 0;
    background: var(--night); color: #fff; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--night); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn.qt { background: linear-gradient(135deg, var(--qt-a), var(--qt-b)); }

  /* --- Passcode gate --- */
  #gate {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; padding: 24px; text-align: center;
    background: var(--night); color: #fff;
  }
  #gate h1 { font-family: var(--display); font-size: 36px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  #gate p { margin: 0 0 6px; color: #aab1cf; font-size: 15px; }
  #gate input {
    font: inherit; font-size: 18px; padding: 14px 16px; border: 1px solid #3a4470; background: #262f55;
    color: #fff; border-radius: 12px; width: min(260px, 82vw); text-align: center; letter-spacing: 0.12em;
  }
  #gate input::placeholder { color: #7c86ad; letter-spacing: 0; }
  #gate input:focus-visible { outline: 2px solid var(--qt-a); outline-offset: 2px; }
  #gate .btn { background: linear-gradient(135deg, var(--qt-a), var(--qt-b)); width: min(260px, 82vw); }
  #gate .err { color: #ffb4c6; font-size: 14px; min-height: 20px; max-width: 300px; }

  #who {
    display: none; position: fixed; inset: 0; z-index: 50; background: var(--night); color: #fff;
    flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center;
  }
  #who h1 { font-family: var(--display); font-size: 36px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  #who p { margin: 0 0 6px; color: #aab1cf; font-size: 15px; }
  #whoChoices { display: flex; flex-direction: column; gap: 10px; width: min(260px, 82vw); }
  #whoChoices .btn { background: linear-gradient(135deg, var(--qt-a), var(--qt-b)); font-size: 17px; padding: 14px; }

  /* --- App shell --- */
  #app { display: none; max-width: 760px; margin: 0 auto; padding: 0 14px 48px; }
  .top { display: flex; justify-content: space-between; align-items: center; padding: 20px 2px 12px; }
  .top h1 { font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .you { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  .you .av {
    width: 30px; height: 30px; border-radius: 50%; background: var(--night); color: #fff;
    display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 14px;
  }
  .you button { background: none; border: 0; padding: 4px; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
  .panel h2.ph { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
  .pill.connected { background: var(--free); border-color: var(--free-edge); color: var(--free-ink); }

  /* --- "Next up" strip --- */
  .next {
    display: block; width: 100%; text-align: left; border: 0; border-radius: 18px; padding: 16px 18px 21px;
    margin-bottom: 12px; background: var(--night); color: #fff; cursor: pointer; position: relative;
    overflow: hidden; -webkit-tap-highlight-color: transparent;
  }
  .next[hidden] { display: none; }
  .next::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: linear-gradient(90deg, var(--dawn), var(--sky) 55%, var(--dusk));
  }
  .next:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .next-label { display: block; font-size: 14px; color: #b8c0e0; }
  .next.alert .next-label { color: var(--ask); }
  .next-when { display: block; font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-top: 4px; line-height: 1.1; }
  .next-sub { display: block; font-size: 14px; color: #b8c0e0; margin-top: 6px; }

  /* --- Review banner --- */
  #reviewBanner { background: var(--ask-soft); border-color: var(--ask-edge); }
  #reviewBanner p { font-size: 14px; color: var(--ask-ink); margin: 0 0 10px; }

  /* --- Month nav + legend --- */
  .monthnav { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 10px; }
  .monthnav h2 { font-family: var(--display); font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .round {
    width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: #fff;
    font-size: 20px; line-height: 1; cursor: pointer; color: var(--night); -webkit-tap-highlight-color: transparent;
  }
  .round:disabled { opacity: 0.3; cursor: default; }
  .round:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 18px; height: 18px; border-radius: 6px; display: inline-block; flex: none; }
  .sw.free { background: var(--free); box-shadow: inset 0 0 0 2px var(--free-edge); }
  .sw.busy { background: repeating-linear-gradient(135deg, var(--busy-a) 0 5px, var(--busy-b) 5px 10px); }
  .sw.ask { background: var(--ask); box-shadow: inset 0 0 0 2px var(--ask-edge); }
  .sw.asked { background: var(--ask-soft); border: 2px dashed var(--ask-edge); }
  .sw.qt { background: linear-gradient(135deg, var(--qt-a), var(--qt-b)); }

  /* --- Grid --- */
  .grid-head, .row-day { display: grid; grid-template-columns: 54px repeat(3, 1fr); gap: 6px; }
  .grid-head { position: sticky; top: 0; z-index: 5; background: var(--card); padding: 8px 0 8px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .col-head { display: flex; flex-direction: column; align-items: center; gap: 1px; font-weight: 700; font-size: 13px; }
  .col-head svg { width: 20px; height: 20px; }
  .col-head.morning svg { color: #e8803a; }
  .col-head.afternoon svg { color: #c98e00; }
  .col-head.night svg { color: #5b4bc4; }
  .col-head .time { font-weight: 500; font-size: 11px; color: var(--muted); }

  .row-day { margin-bottom: 6px; }
  .row-day.mon { margin-top: 16px; }
  .dchip {
    display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px;
    background: #fff; border: 1px solid var(--line); min-height: 52px; line-height: 1.05;
  }
  .dchip small { font-size: 11px; color: var(--muted); font-weight: 600; }
  .dchip b { font-family: var(--display); font-size: 20px; font-weight: 700; }
  .dchip.we { background: #e9e4fb; border-color: #cfc6f2; }
  .dchip.today { background: var(--night); border-color: var(--night); color: #fff; }
  .dchip.today small { color: #b8c0e0; }
  .row-day.past .dchip { opacity: 0.45; }
  .row-day.flash .dchip { box-shadow: 0 0 0 3px var(--qt-a); }

  .cell {
    appearance: none; border: 0; padding: 0; min-height: 52px; border-radius: 12px; position: relative;
    display: flex; align-items: center; justify-content: center; gap: 6px; cursor: default;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
    color: var(--night); font-size: 12px; font-weight: 700;
  }
  .cell:focus-visible { outline: 3px solid var(--night); outline-offset: 2px; }
  .cell.tap { cursor: pointer; }
  .cell.tap:active { transform: scale(0.97); }
  .cell.free { background: var(--free); box-shadow: inset 0 0 0 2px var(--free-edge); color: var(--free-ink); font-size: 24px; font-weight: 500; }
  .cell.busy { background: repeating-linear-gradient(135deg, var(--busy-a) 0 7px, var(--busy-b) 7px 14px); color: var(--busy-ink); }
  .cell.ask-mine { background: var(--ask); box-shadow: inset 0 0 0 2px var(--ask-edge); color: var(--ask-ink); }
  .cell.ask-theirs { background: var(--ask-soft); border: 2px dashed var(--ask-edge); color: var(--ask-ink); }
  .cell.qt { background: linear-gradient(135deg, var(--qt-a), var(--qt-b)); color: #fff; font-family: var(--display); font-weight: 800; font-size: 17px; letter-spacing: 0.04em; }
  .cell.past { background: transparent; box-shadow: inset 0 0 0 1px var(--line); opacity: 0.45; }

  /* --- Booked QT list --- */
  .qt-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .qt-row:last-child { border-bottom: 0; }
  .qt-row small { display: block; color: var(--muted); font-size: 13px; }
  .empty { margin: 0; font-size: 14px; color: var(--muted); }

  /* --- Bottom sheets (slot details + event review) --- */
  #sheet, #tagModal {
    display: none; position: fixed; inset: 0; background: rgba(29, 37, 64, 0.45);
    align-items: flex-end; justify-content: center; z-index: 30;
  }
  #sheet.open { display: flex; }
  #sheet .card, #tagModal .card {
    background: #fff; width: 100%; max-width: 560px; border-radius: 22px 22px 0 0;
    padding: 20px 18px 28px; max-height: 82vh; overflow-y: auto;
  }
  .card h3 { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  .card .sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .blocker { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .blocker .av { width: 28px; height: 28px; flex: none; border-radius: 50%; background: var(--night); color: #fff; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 13px; }
  .blocker .t { font-weight: 600; }
  .blocker .w { color: var(--muted); font-size: 13px; }
  .card .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .tag-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .tag-item .meta { font-size: 13px; color: var(--muted); }
  .tag-text { min-width: 0; }
  .tag-title { font-weight: 600; overflow-wrap: anywhere; }
  .tag-item select { flex: none; max-width: 46%; font: inherit; font-size: 14px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }

  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--night); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px;
    max-width: min(420px, 90vw); text-align: center; transition: opacity 0.2s, transform 0.2s; z-index: 40;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    #toast { transition: none; }
    .cell.tap:active { transform: none; }
  }

  /* --- Connected calendars --- */
  .conn { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .conn .who { flex: 1; min-width: 0; }
  .conn .who b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conn .who small { color: var(--muted); font-size: 12px; }
  .btn.small { padding: 8px 14px; font-size: 13px; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .linkbtn { background: none; border: 0; padding: 6px 2px; color: var(--muted); text-decoration: underline; font-size: 13px; cursor: pointer; }

  /* --- "Has the kids" badges: one colour and one corner per person --- */
  .kid {
    position: absolute; top: -6px; width: 21px; height: 21px; border-radius: 50%;
    display: grid; place-items: center; border: 2px solid #fff; pointer-events: none;
  }
  .kid svg { width: 11px; height: 11px; }
  .kid-0 { left: -5px; background: var(--kid-0); }
  .kid-1 { right: -5px; background: var(--kid-1); }
  .legend .kid { position: static; flex: none; border: 0; width: 18px; height: 18px; }

  /* --- Event chooser: one block per event name, dates expandable --- */
  .tag-item { display: block; padding: 12px 0; }
  .tag-item select { display: block; width: 100%; max-width: none; margin-top: 8px; }
  .tag-item .linkbtn { margin-top: 4px; }
  .dates { margin-top: 6px; padding-left: 12px; border-left: 3px solid var(--line); }
  .date-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; font-size: 14px; }
  .date-row select { width: auto; max-width: 58%; margin-top: 0; font-size: 13px; padding: 6px; }

  /* --- Calendar picker --- */
  .conn { align-items: flex-start; }
  .conn-links { display: flex; gap: 14px; }
  .calpick { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; cursor: pointer; }
  .calpick input { width: 22px; height: 22px; flex: none; accent-color: var(--night); }
  .calpick span { overflow-wrap: anywhere; }

  /* --- Kids days calendar --- */
  .kd-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .kd-wd { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
  .kd-day {
    appearance: none; position: relative; min-height: 46px; border-radius: 10px; border: 1px solid var(--line);
    background: #fff; color: var(--night); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .kd-day.on-all { background: var(--kid); border-color: var(--kid); color: #fff; }
  /* Handover days: a band at the top for the morning, at the bottom for the rest of the day. */
  .kd-day.on-am { border-color: var(--kid); box-shadow: inset 0 13px 0 var(--kid); }
  .kd-day.on-pm { border-color: var(--kid); box-shadow: inset 0 -13px 0 var(--kid); }
  .kd-day.on-pm.cal::after { background: #fff; }
  .seg { display: grid; grid-template-columns: repeat(3, auto); gap: 6px; margin-bottom: 14px; }
  .seg button {
    appearance: none; font: inherit; font-size: 13px; font-weight: 600; padding: 9px 6px; border-radius: 10px;
    border: 1.5px solid var(--line); background: #fff; color: var(--night); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button.on { background: var(--night); border-color: var(--night); color: #fff; }
  .seg button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .kd-day.cal::after {
    content: ""; position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px;
    border-radius: 50%; background: currentColor;
  }
  .kd-day.diff { outline: 3px solid var(--ask-edge); outline-offset: 1px; }
  .kd-day:disabled { opacity: 0.35; cursor: default; }
  .kd-day:focus-visible { outline: 3px solid var(--night); outline-offset: 2px; }
  .kd-key { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .kd-diff { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .kd-diff h4 { margin: 0 0 6px; font-size: 15px; }
  .kd-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 14px; border-top: 1px solid var(--line); }
  .kd-line .linkbtn { flex: none; }
  .kd-field { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .kd-field input { display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 15px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); color: var(--night); }
  #sheet .actions { flex-wrap: wrap; }

  /* --- Plans and clashes --- */
  .plan-field { display: block; font-size: 13px; color: var(--muted); }
  .plan-field textarea {
    display: block; width: 100%; margin-top: 4px; min-height: 76px; resize: vertical; font: inherit; font-size: 15px;
    padding: 10px; border-radius: 10px; border: 1px solid var(--line); color: var(--night);
  }
  .clash-box { background: var(--ask-soft); border: 1px solid var(--ask-edge); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; color: var(--ask-ink); }
  .clash-title { font-weight: 700; margin-bottom: 2px; }
  .cell .warn {
    position: absolute; right: -5px; bottom: -6px; width: 21px; height: 21px; border-radius: 50%;
    display: grid; place-items: center; background: var(--ask); color: var(--ask-ink); border: 2px solid #fff;
    font-family: var(--display); font-size: 13px; font-weight: 800; letter-spacing: 0;
  }
  .qt-text { flex: 1; min-width: 0; }
  .qt-row small.plan { color: var(--night); overflow-wrap: anywhere; }
  .qt-row small.clash-note { color: #9a3412; font-weight: 600; }
  .qt-row .linkbtn { flex: none; }

  /* --- Bank holidays --- */
  .hol { margin: 0 0 4px 60px; font-size: 12px; font-weight: 700; color: #9a4410; }
  .hol.mon { margin-top: 16px; }
  .dchip.hol-day { background: #ffe6d1; border-color: #f0b488; }
  .dchip.hol-day.today { background: var(--night); border-color: var(--night); }

  /* Messages appear at the top so they never cover the buttons of a bottom sheet. */
  #toast { top: 14px; bottom: auto; transform: translate(-50%, -20px); }
  #toast.show { transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- ============== PASSCODE GATE ============== -->
<!-- Nothing below this loads or renders until the passcode is verified server-side. -->
<div id="gate">
  <h1>Meet up</h1>
  <p>Enter the passcode to continue.</p>
  <input id="passcodeInput" type="password" placeholder="Passcode" maxlength="40" autocomplete="off"
         onkeydown="if (event.key === 'Enter') submitPasscode()">
  <button class="btn" onclick="submitPasscode()">Unlock</button>
  <div class="err" id="gateError" role="status"></div>
</div>

<!-- ============== WHO ARE YOU (first visit on a device) ============== -->
<div id="who">
  <h1>Who's this?</h1>
  <p>Pick your name. This device will remember it.</p>
  <div id="whoChoices"></div>
</div>

<!-- ============== MAIN APP (hidden until unlocked) ============== -->
<div id="app">
  <div class="top">
    <h1>Meet up</h1>
    <div class="you" id="whoAmIRow"></div>
  </div>

  <button id="nextUp" class="next" type="button" hidden>
    <span class="next-label" id="nextLabel"></span>
    <span class="next-when" id="nextWhen"></span>
    <span class="next-sub" id="nextSub"></span>
  </button>

  <section class="panel" id="reviewBanner" style="display:none;">
    <h2 class="ph">New events to review</h2>
    <p id="reviewCount"></p>
    <button class="btn" onclick="openTagModal()">Review events</button>
  </section>

  <section class="panel" id="connectSection">
    <h2 class="ph">Calendars</h2>
    <div class="row" id="connectRow"></div>
  </section>

  <section class="panel">
    <div class="monthnav">
      <button class="round" id="prevMonth" aria-label="Previous month" onclick="shiftMonth(-1)">‹</button>
      <h2 id="monthLabel"></h2>
      <button class="round" id="nextMonth" aria-label="Next month" onclick="shiftMonth(1)">›</button>
    </div>
    <div class="legend" aria-label="Key">
      <span><i class="sw free"></i>Free for both</span>
      <span><i class="sw busy"></i>Busy (T or S shows whose)</span>
      <span><i class="sw ask"></i>You asked</span>
      <span><i class="sw asked"></i>They asked</span>
      <span><i class="sw qt"></i>QT booked (! means a clash)</span>
    </div>
    <div class="grid-head" id="gridHead"></div>
    <div id="gridBody"></div>
  </section>

  <section class="panel">
    <h2 class="ph">Booked QT</h2>
    <div id="qtList"></div>
  </section>
</div>

<!-- ============== SLOT DETAILS + TOAST ============== -->
<div id="sheet" role="dialog" aria-modal="true" aria-label="Slot details"><div class="card"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- ============== EVENT REVIEW ============== -->
<div id="tagModal" role="dialog" aria-modal="true" aria-labelledby="tagTitle">
  <div class="card">

  },

/* =====================================================================
   FIREBASE SETUP
   ===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithCustomToken, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const fbApp = initializeApp(CONFIG.firebase);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* Who is using the page right now — chosen once by tapping a name, and
   remembered on this device. There is no default: nobody becomes someone
   else by mistyping. */
async function currentPersonId() {
  const stored = localStorage.getItem("meetup-person-id");
  if (CONFIG.people.some(p => p.id === stored)) return stored;
  const screen = document.getElementById("who");
  const choices = document.getElementById("whoChoices");
  screen.style.display = "flex";
  const id = await new Promise(resolve => {
    CONFIG.people.forEach(p => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn";
      b.textContent = `I'm ${p.label}`;
      b.onclick = () => resolve(p.id);
      choices.append(b);
    });
  });
  localStorage.setItem("meetup-person-id", id);
  screen.style.display = "none";
  return id;
}
const ME = await currentPersonId();
const OTHER = CONFIG.people.find(p => p.id !== ME).id;

/* =====================================================================
   PASSCODE GATE
   The page shows nothing else until this succeeds. The passcode itself
   is never checked in this file — it's sent to a Cloud Function, which
   is the only thing that knows the correct hash, and which mints a
   Firebase custom auth token only if it matches. See functions/index.js.
   ===================================================================== */
window.submitPasscode = async function () {
  const code = document.getElementById("passcodeInput").value.trim();
  const errEl = document.getElementById("gateError");
  errEl.textContent = "";
  if (!code) return;
  errEl.textContent = "Checking…";
  let res;
  try {
    res = await fetch(CONFIG.functions.passcodeLoginUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ passcode: code }),
    });
  } catch (e) {
    // The request never completed — usually a CORS/origin mismatch or no connection.
    errEl.textContent = "Couldn't reach the server (network or CORS problem): " + e.message;
    return;
  }
  if (res.status === 401) {
    errEl.textContent = "That passcode isn't right.";
    return;
  }
  if (res.status === 429) {
    errEl.textContent = "Too many attempts — try again later.";
    return;
  }
  if (!res.ok) {
    let detail = "";
    try { detail = " " + (await res.text()).slice(0, 120); } catch (_) {}
    errEl.textContent = "Server error " + res.status + "." + detail;
    return;
  }
  try {
    const { token } = await res.json();
    await signInWithCustomToken(auth, token);
    errEl.textContent = "";
  } catch (e) {
    errEl.textContent = "Passcode accepted, but sign-in failed: " + (e.code || e.message);
  }
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    boot();
  }
});

/* =====================================================================
   CALENDAR CONNECT
   Google: OAuth via Google Identity Services, browser-only, no secret.
   iCloud: app-specific password, sent to the relay function which
   speaks CalDAV to caldav.icloud.com on the page's behalf (browsers
   can't call it directly — no CORS support).
   Each connection remembers which of its calendars are switched on.
   ===================================================================== */
const CONNECTED_KEY = `meetup-connections-${ME}`;
const AUTO_SYNC_AFTER_MS = 6 * 60 * 60 * 1000;

function getConnections() {
  try {
    const list = JSON.parse(localStorage.getItem(CONNECTED_KEY) || "[]");
    // Google entries saved by the first version had no account email, so
    // they can't be told apart or synced again — they're dropped here.
    return list.filter(c => (c.type === "icloud" ? c.appleId : c.email));
  } catch (_) { return []; }
}
function saveConnections(list) {
  localStorage.setItem(CONNECTED_KEY, JSON.stringify(list));
  renderConnectRow();
}
const connName = (c) => c.email || c.appleId;
const typeLabel = (c) => (c.type === "google" ? "Google" : "iCloud");
const sameConn = (a, b) => a.type === b.type && connName(a) === connName(b);
const findConnection = (conn) => getConnections().find(c => sameConn(c, conn));
function upsertConnection(conn) {
  const list = getConnections();
  const i = list.findIndex(c => sameConn(c, conn));
  if (i >= 0) list[i] = { ...list[i], ...conn }; else list.push(conn);
  saveConnections(list);
}
function forgetConnection(conn) {
  saveConnections(getConnections().filter(c => !sameConn(c, conn)));
  toast(`Forgot ${connName(conn)} on this device. Events already synced stay in the planner.`);
}

function renderConnectRow() {
  const wrap = $("connectRow");
  wrap.className = "";
  wrap.replaceChildren();

  getConnections().forEach(c => {
    const row = el("div", "conn");
    const who = el("div", "who");
    who.append(el("b", "", `${typeLabel(c)} · ${connName(c)}`));
    let status = c.lastSync ? `Synced ${shortDate(new Date(c.lastSync))}, ${fmtClock(new Date(c.lastSync))}` : "Not synced yet";
    if (c.type === "icloud" && c.appPassword) status += " · password remembered";
    who.append(el("small", "", status));

    const links = el("div", "conn-links");
    const cals = Object.values(c.cals || {});
    if (cals.length) {
      const off = cals.filter(cal => !cal.on).length;
      const pick = el("button", "linkbtn", off ? `Calendars (${off} off)` : "Calendars");
      pick.type = "button";
      pick.onclick = () => openCalendarPicker(c);
      links.append(pick);
    }
    const forget = el("button", "linkbtn", "Forget");
    forget.type = "button";
    forget.onclick = () => forgetConnection(c);
    links.append(forget);
    who.append(links);

    const sync = el("button", "btn small", "Sync");
    sync.type = "button";
    sync.onclick = () => runSync(sync, () => (c.type === "google" ? syncGoogle(c.email) : syncICloud(c)));
    row.append(who, sync);
    wrap.append(row);
  });

  const buttons = el("div", "row");
  buttons.style.marginTop = "12px";
  const addGoogle = el("button", "btn", "Add Google");
  addGoogle.type = "button";
  addGoogle.onclick = () => runSync(addGoogle, () => syncGoogle());
  const addICloud = el("button", "btn", "Add iCloud");
  addICloud.type = "button";
  addICloud.onclick = () => runSync(addICloud, () => connectICloud());
  const mine = el("button", "btn ghost", "My events");
  mine.type = "button";
  mine.onclick = openMyEvents;
  const kidsDays = el("button", "btn ghost", "Kids days");
  kidsDays.type = "button";
  kidsDays.onclick = openKidsDays;
  buttons.append(addGoogle, addICloud, mine, kidsDays);
  wrap.append(buttons);
}

/* Which of an account's calendars feed the planner. Saving syncs straight
   away, which also removes events from any calendar just switched off. */
function openCalendarPicker(conn) {
  openSheet(card => {
    card.append(el("h3", "", "Calendars to include"));
    card.append(el("p", "sub", `${typeLabel(conn)} · ${connName(conn)}. Untick any calendar you don't want in the planner.`));
    const boxes = [];
    Object.entries(conn.cals)
      .sort((a, b) => a[1].name.localeCompare(b[1].name))
      .forEach(([id, cal]) => {
        const label = el("label", "calpick");
        const box = document.createElement("input");
        box.type = "checkbox";
        box.checked = !!cal.on;
        label.append(box, el("span", "", cal.name));
        boxes.push([id, box]);
        card.append(label);
      });
    const actions = el("div", "actions");
    const cancel = el("button", "btn ghost", "Cancel");
    cancel.type = "button";
    cancel.onclick = closeSheet;
    const save = el("button", "btn", "Save and sync");
    save.type = "button";
    save.onclick = () => {
      const cals = {};
      boxes.forEach(([id, box]) => cals[id] = { name: conn.cals[id].name, on: box.checked });
      upsertConnection({ ...conn, cals });
      closeSheet();
      const fresh = findConnection(conn);
      runSync(null, () => (conn.type === "google" ? syncGoogle(conn.email) : syncICloud(fresh)));
    };
    actions.append(cancel, save);
    card.append(actions);
  });
}

/* Runs one sync, shows progress on the button, and reports the outcome. */
async function runSync(button, job) {
  const label = button?.textContent;
  if (button) { button.disabled = true; button.textContent = "Syncing…"; }
  else toast("Syncing…");
  try {
    const result = await job();
    if (result) toast(syncSummary(result));
  } catch (e) {
    toast(`Sync didn't work: ${e.message}`);
  }
  // renderConnectRow may already have replaced this button; harmless if so.
  if (button) { button.disabled = false; button.textContent = label; }
}
function syncSummary(result) {
  const clashNote = clashCount
    ? ` ${clashCount === 1 ? "A booked QT now has" : `${clashCount} booked QTs now have`} a clash — see the top of the page.`
    : "";
  return baseSummary(result) + clashNote;
}
function baseSummary({ total, review }) {
  if (!total) return "Synced. No events found in the next six months.";
  if (review) return `Synced ${total} events. ${review} new ${review === 1 ? "one needs" : "ones need"} a choice — see "New events to review".`;
  return `Synced ${total} events. Nothing new to review.`;
}

const rangeStart = new Date();
const rangeEnd = new Date();
rangeEnd.setMonth(rangeEnd.getMonth() + CONFIG.monthsAhead);

/* --- Google --- */
function googleToken(emailHint) {
  return new Promise((resolve, reject) => {
    if (!window.google?.accounts?.oauth2) {
      reject(new Error("Google sign-in hasn't loaded yet. Wait a moment and try again."));
      return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CONFIG.googleClientId,
      scope: "https://www.googleapis.com/auth/calendar.readonly",
      // A known account re-syncs without the account chooser where Google allows it.
      login_hint: emailHint || undefined,
      prompt: emailHint ? "" : "select_account",
      callback: (resp) => (resp.error ? reject(new Error(resp.error)) : resolve(resp.access_token)),
      error_callback: (err) => reject(new Error(err?.type === "popup_closed" ? "the Google window was closed" : (err?.type || "Google sign-in failed"))),
    });
    client.requestAccessToken();
  });
}

async function googleGet(url, token) {
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error(`Google Calendar returned an error (${res.status})`);
  return res.json();
}

async function syncGoogle(emailHint) {
  const token = await googleToken(emailHint);
  const base = "https://www.googleapis.com/calendar/v3";
  const primary = await googleGet(`${base}/calendars/primary`, token);
  const email = primary.id || emailHint || "account";
  const prev = findConnection({ type: "google", email })?.cals || {};

  // Every calendar in the account is listed so it can be switched on or off.
  // New ones start on if they're ticked in Google Calendar itself, except
  // Google's own holiday and birthday calendars, which start off.
  const list = await googleGet(`${base}/users/me/calendarList?maxResults=250`, token);
  const cals = {};
  (list.items || []).forEach(c => {
    const builtIn = /#(holiday|contacts|weather)@/.test(c.id);
    cals[c.id] = {
      name: c.summaryOverride || c.summary || c.id,
      on: prev[c.id] ? !!prev[c.id].on : (c.selected !== false && !builtIn),
    };
  });

  const events = [];
  for (const [calId, cal] of Object.entries(cals)) {
    if (!cal.on) continue;
    let pageToken = "";
    do {
      const url = new URL(`${base}/calendars/${encodeURIComponent(calId)}/events`);
      url.searchParams.set("timeMin", rangeStart.toISOString());
      url.searchParams.set("timeMax", rangeEnd.toISOString());
      url.searchParams.set("singleEvents", "true");
      url.searchParams.set("maxResults", "2500");
      if (pageToken) url.searchParams.set("pageToken", pageToken);
      const data = await googleGet(url, token);
      (data.items || [])
        .filter(e => e.status !== "cancelled" && e.eventType !== "birthday" && (e.start?.dateTime || e.start?.date))
        .forEach(e => events.push({
          id: e.id,
          title: e.summary || "(no title)",
          start: e.start.dateTime || e.start.date,
          end: e.end?.dateTime || e.end?.date || e.start.dateTime || e.start.date,
          recurringEventId: e.recurringEventId || e.id,
          cal: cal.name,
        }));
      pageToken = data.nextPageToken || "";
    } while (pageToken);
  }

  const result = await stageEvents(events, `google:${email}`);
  upsertConnection({ type: "google", email, lastSync: Date.now(), cals });
  return result;
}

/* --- iCloud --- */
async function fetchICloud(appleId, appPassword, skip) {
  let res;
  try {
    res = await fetch(CONFIG.functions.icloudEventsUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        appleId, appPassword, skip,
        rangeStart: rangeStart.toISOString(),
        rangeEnd: rangeEnd.toISOString(),
      }),
    });
  } catch (e) {
    throw new Error("couldn't reach the server");
  }
  let body = null;
  try { body = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(body?.error || `the server returned an error (${res.status})`);
  // The first version of the server sent a bare list of events; the current
  // one also sends the account's calendars so they can be switched on or off.
  if (Array.isArray(body)) return { events: body, calendars: null };
  if (Array.isArray(body?.events)) return body;
  throw new Error("the server sent something unexpected");
}

async function connectICloud() {
  const appleId = (prompt("Your Apple ID email:") || "").trim();
  if (!appleId) return null;
  return syncICloud(findConnection({ type: "icloud", appleId }) || { type: "icloud", appleId });
}

async function syncICloud(conn, { quiet = false } = {}) {
  let appPassword = conn.appPassword;
  const typed = !appPassword;
  if (typed) {
    if (quiet) return null;
    appPassword = (prompt(`App-specific password for ${conn.appleId} (create one at account.apple.com):`) || "").trim();
    if (!appPassword) return null;
  }
  const prev = conn.cals || {};
  const skip = Object.keys(prev).filter(id => !prev[id].on);
  const data = await fetchICloud(conn.appleId, appPassword, skip);

  let cals = null;
  if (data.calendars) {
    cals = {};
    data.calendars.forEach(c => cals[c.id] = { name: c.name, on: prev[c.id] ? !!prev[c.id].on : true });
  }
  const events = data.events
    .filter(ev => !(cals && ev.calendarId && cals[ev.calendarId] && !cals[ev.calendarId].on))
    .map(ev => ({ ...ev, cal: ev.calendar }));
  const result = await stageEvents(events, `icloud:${conn.appleId}`);

  const update = { type: "icloud", appleId: conn.appleId, lastSync: Date.now() };
  if (cals) update.cals = cals;
  // Remembering is opt-in, and only offered once the password has worked.
  if (typed && confirm(
    "Remember this app password on this device?\n\n" +
    "Syncing then happens by itself when you open the planner. The password is kept " +
    "only in this browser, and you can remove it any time with Forget."
  )) update.appPassword = appPassword;
  upsertConnection(update);
  return result;
}

/* Remembered iCloud accounts refresh by themselves when the page opens. */
async function autoSync() {
  const due = getConnections().filter(c =>
    c.type === "icloud" && c.appPassword && Date.now() - (c.lastSync || 0) > AUTO_SYNC_AFTER_MS);
  for (const c of due) {
    try {
      const result = await syncICloud(c, { quiet: true });
      if (result?.review) toast(syncSummary(result));
    } catch (e) {
      toast(`Couldn't sync ${c.appleId}: ${e.message}`);
    }
  }
}

/* =====================================================================
   EVENT CHOICES
   Each synced event carries one choice:
     busy      — blocks the slot
     free      — ignored
     kids      — doesn't block, but the slot shows that person has their kids
     withkids  — blocks only when it falls inside one of that person's
                 "kids" periods (a lesson you only take them to on your days)
   A choice made for a whole title is remembered as a rule, so repeats and
   future events with that title follow it. Individual dates can differ.
   Events that already have a choice keep it on every later sync.
   ===================================================================== */
const CHOICES = [
  ["busy", "Busy"],
  ["free", "Free"],
  ["kids", "Free, kids with me"],
  ["withkids", "Busy only if kids with me"],
];
const isQtEntry = (ev) => /^qt\b/i.test(ev.title || "");
const safeId = (id) => String(id).replace(/\//g, "_");
const ruleId = (key) => encodeURIComponent(String(key)).replace(/\./g, "%2E").slice(0, 900);
const titleRule = (title) => ruleId("title:" + title);

let pendingEvents = [];

async function commitWrites(writes) {
  for (let i = 0; i < writes.length; i += 400) {
    const batch = writeBatch(db);
    // A null value means "delete this document".
    writes.slice(i, i + 400).forEach(([ref, data]) => (data === null ? batch.delete(ref) : batch.set(ref, data)));
    await batch.commit();
  }
}

function eventDoc(ev, tag) {
  const data = { title: ev.title, start: ev.start, end: ev.end, tag };
  if (ev.source) data.source = ev.source;
  if (ev.cal) data.cal = ev.cal;
  return data;
}

/* `source` names the calendar account the events came from, so a later sync
   of the same account can clear out events that no longer exist there. */
/* Birthday reminders (all-day entries with "birthday" in the name) are left
   out altogether. A timed event such as a birthday dinner still comes through. */
function isAllDay(ev) {
  if (/^\d{4}-\d{2}-\d{2}$/.test(String(ev.start))) return true;
  const start = new Date(ev.start), end = new Date(ev.end);
  const midnight = (start.getUTCHours() === 0 && start.getUTCMinutes() === 0) ||
                   (start.getHours() === 0 && start.getMinutes() === 0);
  const length = end - start;
  return midnight && length > 0 && length % 86400000 === 0;
}
const isBirthdayReminder = (ev) => /birthday/i.test(ev.title || "") && isAllDay(ev);

async function stageEvents(allEvents, source) {
  const events = allEvents.filter(ev => !isBirthdayReminder(ev));
  const [rulesSnap, mineSnap] = await Promise.all([
    getDocs(collection(db, `people/${ME}/rules`)),
    getDocs(collection(db, `people/${ME}/events`)),
  ]);
  const rules = {};
  rulesSnap.forEach(d => rules[d.id] = d.data().tag);
  const existing = {};
  mineSnap.forEach(d => existing[d.id] = d.data());

  const writes = [];
  const toReview = [];
  for (const raw of events) {
    const ev = { ...raw, id: safeId(raw.id), source };
    // A QT plan downloaded from here and synced back is never asked about.
    const tag = (isQtEntry(ev) && "qt")
      || existing[ev.id]?.tag
      || rules[titleRule(ev.title)]
      || rules[ruleId(ev.recurringEventId || ev.title)];
    if (tag) writes.push([doc(db, `people/${ME}/events/${ev.id}`), eventDoc(ev, tag)]);
    else toReview.push({ id: ev.id, title: ev.title, start: ev.start, end: ev.end, source, cal: ev.cal });
  }
  // Events this account synced before that it no longer has: deleted, moved,
  // or in a calendar that has since been switched off.
  const fetched = new Set(events.map(ev => safeId(ev.id)));
  Object.entries(existing).forEach(([id, data]) => {
    if (data.source === source && !fetched.has(id)) writes.push([doc(db, `people/${ME}/events/${id}`), null]);
  });
  await commitWrites(writes);

  pendingEvents = pendingEvents.filter(e => e.source !== source).concat(toReview);
  showReviewBanner();
  await renderGrid();
  return { total: events.length, review: groupByTitle(toReview).length };
}

function showReviewBanner() {
  const n = groupByTitle(pendingEvents).length;
  $("reviewBanner").style.display = n ? "block" : "none";
  $("reviewCount").textContent = n === 1
    ? "1 new event needs a choice: does it keep you busy, or could you meet anyway?"
    : `${n} new events need a choice: do they keep you busy, or could you meet anyway?`;
}

function groupByTitle(events) {
  const groups = new Map();
  events.forEach(ev => {
    const title = ev.title || "(no title)";
    if (!groups.has(title)) groups.set(title, { title, events: [] });
    groups.get(title).events.push(ev);
  });
  const list = [...groups.values()];
  list.forEach(g => g.events.sort((a, b) => new Date(a.start) - new Date(b.start)));
  return list.sort((a, b) => new Date(a.events[0].start) - new Date(b.events[0].start));
}

/* Where an event came from, in words: the calendar's name when known. */
function sourceLabel(ev) {
  const [kind, ...rest] = String(ev.source || "").split(":");
  const account = rest.join(":");
  const type = kind === "google" ? "Google" : kind === "icloud" ? "iCloud" : "";
  if (ev.cal) return type ? `${ev.cal} (${type})` : ev.cal;
  return type ? `${type} · ${account}` : "";
}

function choiceSelect(label) {
  const select = document.createElement("select");
  select.setAttribute("aria-label", label);
  CHOICES.forEach(([value, text]) => {
    const o = document.createElement("option");
    o.value = value; o.textContent = text;
    select.append(o);
  });
  return select;
}
function setMixed(select, mixed) {
  let o = select.querySelector('option[value="mixed"]');
  if (mixed && !o) {
    o = document.createElement("option");
    o.value = "mixed"; o.textContent = "Different on different dates";
    select.append(o);
  }
  if (!mixed && o) o.remove();
}

/* One chooser serves both jobs: first-time review, and changing choices later. */
let chooser = null;

function openChooser({ title, sub, groups, review, emptyText }) {
  chooser = { groups, review };
  $("tagTitle").textContent = title;
  $("tagSub").textContent = sub;
  const list = $("tagList");
  list.replaceChildren();
  if (!groups.length) list.append(el("p", "empty", emptyText));

  groups.forEach(g => {
    g.choices = g.events.map(ev => ev.tag || "busy");
    const row = el("div", "tag-item");
    const first = new Date(g.events[0].start);
    const where = [...new Set(g.events.map(sourceLabel).filter(Boolean))].join(", ");
    row.append(
      el("div", "tag-title", g.title),
      el("div", "meta", `${shortDate(first)}, ${fmtClock(first)}` +
        (g.events.length > 1 ? ` · and ${g.events.length - 1} more` : "") +
        (where ? ` · ${where}` : ""))
    );

    const groupSel = choiceSelect(`Choice for ${g.title}`);
    let dates = null;
    const refresh = () => {
      const same = g.choices.every(c => c === g.choices[0]);
      setMixed(groupSel, !same);
      groupSel.value = same ? g.choices[0] : "mixed";
    };
    groupSel.onchange = () => {
      if (groupSel.value === "mixed") return;
      g.choices = g.choices.map(() => groupSel.value);
      if (dates) dates.querySelectorAll("select").forEach(s => s.value = groupSel.value);
      refresh();
    };
    row.append(groupSel);

    if (g.events.length > 1) {
      const toggle = el("button", "linkbtn", "Choose date by date");
      toggle.type = "button";
      dates = el("div", "dates");
      dates.hidden = true;
      toggle.onclick = () => {
        if (!dates.childElementCount) {
          g.events.forEach((ev, k) => {
            const when = new Date(ev.start);
            const line = el("div", "date-row");
            const sel = choiceSelect(`Choice for ${g.title} on ${shortDate(when)}`);
            sel.value = g.choices[k];
            sel.onchange = () => { g.choices[k] = sel.value; refresh(); };
            line.append(el("span", "", `${shortDate(when)}, ${fmtClock(when)}`), sel);
            dates.append(line);
          });
        }
        dates.hidden = !dates.hidden;
        toggle.textContent = dates.hidden ? "Choose date by date" : "Hide dates";
      };
      row.append(toggle, dates);
    }
    refresh();
    list.append(row);
  });
  $("tagSave").style.display = groups.length ? "" : "none";
  $("tagClear").style.display = review ? "none" : "";
  $("tagModal").style.display = "flex";
}

/* Start again: removes every event stored under this person (not their
   calendars, and not their remembered choices). A fresh sync brings back
   only what's really in their calendars. */
window.clearMyEvents = async function () {
  if (!confirm(
    `Remove every event synced under ${personLabel(ME)}?\n\n` +
    "Your real calendars aren't touched, and your choices and kids days are kept. " +
    "Sync your calendars again afterwards to bring your own events back."
  )) return;
  try {
    const snap = await getDocs(collection(db, `people/${ME}/events`));
    const writes = [];
    snap.forEach(d => {
      if (d.data().source !== "manual") writes.push([doc(db, `people/${ME}/events/${d.id}`), null]);
    });
    await commitWrites(writes);
    pendingEvents = [];
    showReviewBanner();
    closeTagModal();
    toast(`Removed ${writes.length} events. Now sync your calendars to bring yours back.`);
    renderGrid();
  } catch (e) {
    toast("Couldn't remove the events. Check your connection and try again.");
  }
};

window.closeTagModal = function () {
  $("tagModal").style.display = "none";
  chooser = null;
};

window.saveTagChoices = async function () {
  if (!chooser) return;
  const { groups, review } = chooser;
  const writes = [];
  let changed = 0;
  groups.forEach(g => {
    let touched = false;
    g.events.forEach((ev, k) => {
      const tag = g.choices[k];
      if (!review && tag === ev.tag) return;
      writes.push([doc(db, `people/${ME}/events/${ev.id}`), eventDoc(ev, tag)]);
      touched = true;
    });
    if (!touched) return;
    changed++;
    // A single choice for the whole title becomes the rule for future dates.
    // Mixed choices leave the rule alone, so new dates get asked about.
    if (g.choices.every(c => c === g.choices[0])) {
      writes.push([doc(db, `people/${ME}/rules/${titleRule(g.title)}`), { tag: g.choices[0] }]);
    }
  });

  const saveBtn = $("tagSave");
  saveBtn.disabled = true;
  try {
    await commitWrites(writes);
  } catch (e) {
    saveBtn.disabled = false;
    toast("Couldn't save your choices. Check your connection and try again.");
    return;
  }
  saveBtn.disabled = false;

  if (review) {
    const done = new Set(groups.flatMap(g => g.events.map(ev => ev.id)));
    pendingEvents = pendingEvents.filter(ev => !done.has(ev.id));
    showReviewBanner();
  }
  closeTagModal();
  toast(changed ? `Saved ${changed} ${changed === 1 ? "choice" : "choices"}.` : "Nothing changed.");
  renderGrid();
};

/* =====================================================================
   GRID — six months rolling, three buckets a day
   ===================================================================== */
let viewMonthOffset = 0;

/* --- Bank holidays: marked on the grid, never treated as busy ---
   The dates come from the official gov.uk lists and are kept on the device
   for a week, so the page still shows them offline. A holiday that isn't
   shared by every list says which one it belongs to. */
const HOLIDAY_KEY = "meetup-holidays";
const REGION_NAMES = { "scotland": "Scotland", "england-and-wales": "England and Wales", "northern-ireland": "Northern Ireland" };
const holidayRegions = () => CONFIG.holidayRegions || [];
let holidays = {};
function readCachedHolidays() {
  try {
    const c = JSON.parse(localStorage.getItem(HOLIDAY_KEY) || "null");
    if (c && c.region === holidayRegions().join("+") && c.days) {
      holidays = c.days;
      return Date.now() - c.at < 7 * 86400000;
    }
  } catch (_) {}
  return false;
}
function mergeHolidays(data) {
  const regions = holidayRegions();
  const byDate = {};
  regions.forEach(region => (data[region]?.events || []).forEach(e => {
    const names = (byDate[e.date] ||= {});
    (names[e.title] ||= []).push(region);
  }));
  const days = {};
  Object.entries(byDate).forEach(([date, names]) => {
    days[date] = Object.entries(names).map(([title, where]) =>
      where.length === regions.length ? title : `${title} (${where.map(r => REGION_NAMES[r] || r).join(", ")} only)`
    ).join(" / ");
  });
  return days;
}
async function refreshHolidays() {
  if (!holidayRegions().length || readCachedHolidays()) return false;
  try {
    const res = await fetch("https://www.gov.uk/bank-holidays.json");
    if (!res.ok) return false;
    const days = mergeHolidays(await res.json());
    if (!Object.keys(days).length) return false;
    holidays = days;
    localStorage.setItem(HOLIDAY_KEY, JSON.stringify({ region: holidayRegions().join("+"), at: Date.now(), days }));
    return true;
  } catch (_) {
    return false; // no holiday labels this time; everything else still works
  }
}
let pendingScroll = null;
let firstRender = true;

async function loadBusyIntervals(personId) {
  const snap = await getDocs(collection(db, `people/${personId}/events`));
  const intervals = [];
  snap.forEach(d => {
    const e = d.data();
    if (e.tag === "busy" || e.tag === "kids" || e.tag === "withkids") {
      intervals.push({ start: new Date(e.start), end: new Date(e.end), title: e.title, owner: personId, tag: e.tag });
    }
  });
  return intervals;
}

async function loadMatches() {
  const snap = await getDocs(collection(db, "matches"));
  const matches = {};
  snap.forEach(d => matches[d.id] = d.data());
  return matches;
}

function bucketInfo(day, bucket, busy, matches, now, kids = []) {
  const bStart = new Date(day); bStart.setHours(bucket.startHour, 0, 0, 0);
  const bEnd = new Date(day); bEnd.setHours(bucket.endHour, 0, 0, 0);
  const key = `${dateKey(day)}_${bucket.key}`;
  const match = matches[key];
  const overlaps = (iv) => iv.start < bEnd && iv.end > bStart;
  // The calendar copy of a QT plan (its name starts with "QT") never blocks or clashes.
  const blockers = busy.filter(iv => overlaps(iv) && !isQtEntry(iv));
  const kidOwners = [...new Set(kids.filter(overlaps).map(iv => iv.owner))];

  let status;
  if (bEnd <= now) status = "past";
  else if (match?.status === "qt") status = "qt";
  else if (blockers.length) status = "busy";
  else if (match?.[ME]) status = "ask-mine";
  else if (match?.[OTHER]) status = "ask-theirs";
  else status = "free";
  // A booked QT stays booked, but anything busy that lands on it is a clash.
  const clash = status === "qt" ? blockers : [];
  return { status, key, match, blockers, clash, kidOwners, bStart, bEnd };
}

function renderHead() {
  const head = $("gridHead");
  head.replaceChildren(el("div"));
  CONFIG.buckets.forEach(b => {
    const col = el("div", `col-head ${b.key}`);
    const icon = el("span");
    icon.innerHTML = ICONS[b.key] || "";
    col.append(icon, el("span", "", b.label), el("span", "time", bucketRange(b)));
    head.appendChild(col);
  });
}

function makeCell(info, day, bucket) {
  const b = el("button", `cell ${info.status}`);
  b.type = "button";
  const when = `${longDate(day)}, ${bucket.label.toLowerCase()}`;

  if (info.status === "free") {
    b.textContent = "+";
    b.classList.add("tap");
    b.setAttribute("aria-label", `${when}: free for both. Tap to suggest it.`);
    b.onclick = () => showSlot(info, day, bucket);
  } else if (info.status === "ask-mine") {
    b.textContent = "You ✓";
    b.classList.add("tap");
    b.setAttribute("aria-label", `${when}: you suggested this. Tap to change the plan or withdraw.`);
    b.onclick = () => showSlot(info, day, bucket);
  } else if (info.status === "ask-theirs") {
    b.textContent = `${initialOf(OTHER)} asked`;
    b.classList.add("tap");
    b.setAttribute("aria-label", `${when}: ${personLabel(OTHER)} suggested this. Tap to say yes.`);
    b.onclick = () => showSlot(info, day, bucket);
  } else if (info.status === "busy") {
    const owners = [...new Set(info.blockers.map(x => x.owner))].sort();
    b.textContent = owners.map(initialOf).join("+");
    b.classList.add("tap");
    b.setAttribute("aria-label", `${when}: busy. Tap to see why.`);
    b.onclick = () => showBusy(info, day, bucket);
  } else if (info.status === "qt") {
    b.textContent = "QT";
    b.classList.add("tap");
    b.setAttribute("aria-label", `${when}: QT booked${info.clash.length ? ", but something now clashes with it" : ""}. Tap for details.`);
    if (info.clash.length) { b.classList.add("clash"); b.append(el("span", "warn", "!")); }
    b.onclick = () => showSlot(info, day, bucket);
  } else {
    b.disabled = true;
    b.setAttribute("aria-label", `${when}: already passed.`);
  }
  if (info.status !== "past" && info.kidOwners.length) {
    info.kidOwners.forEach(owner => b.append(kidBadge(owner)));
    b.setAttribute("aria-label", b.getAttribute("aria-label") + " " +
      info.kidOwners.map(o => `${personLabel(o)} has the kids.`).join(" "));
  }
  return b;
}

const KID_SVG = '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="3.6" r="2.4" fill="#fff"/><path d="M1.8 11.4c0-2.6 1.9-4.2 4.2-4.2s4.2 1.6 4.2 4.2z" fill="#fff"/></svg>';
function kidBadge(owner) {
  const badge = el("span", `kid kid-${Math.max(0, CONFIG.people.findIndex(p => p.id === owner))}`);
  badge.innerHTML = KID_SVG;
  return badge;
}
function renderKidsLegend() {
  const legend = document.querySelector(".legend");
  legend.querySelectorAll(".kids-key").forEach(n => n.remove());
  CONFIG.people.forEach(p => {

async function renderGrid() {
  const [myBusy, theirBusy, matches] = await Promise.all([
    loadBusyIntervals(ME), loadBusyIntervals(OTHER), loadMatches(),
  ]);
  const all = myBusy.concat(theirBusy);
  const kids = all.filter(iv => iv.tag === "kids");
  // "Busy only if kids with me" events block only inside that person's kids periods.
  const busy = all.filter(iv => iv.tag === "busy" || (iv.tag === "withkids" &&
    kids.some(k => k.owner === iv.owner && k.start < iv.end && k.end > iv.start)));
  const now = new Date();

  renderHead();

  const viewMonth = new Date(now.getFullYear(), now.getMonth() + viewMonthOffset, 1);
  $("monthLabel").textContent = viewMonth.toLocaleString("en-GB", { month: "long", year: "numeric" });
  $("prevMonth").disabled = viewMonthOffset <= 0;
  $("nextMonth").disabled = viewMonthOffset >= CONFIG.monthsAhead;

  const body = $("gridBody");
  body.replaceChildren();
  const todayKey = dateKey(now);
  const daysInMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();

  for (let d = 1; d <= daysInMonth; d++) {
    const day = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), d);
    const dow = day.getDay();
    const key = dateKey(day);
    const row = el("div", "row-day");
    row.dataset.date = key;
    const weekGap = dow === 1 && body.children.length > 0;

    const infos = CONFIG.buckets.map(bucket => bucketInfo(day, bucket, busy, matches, now, kids));
    if (infos.every(i => i.status === "past")) continue; // days already gone aren't shown

    const chip = el("div", "dchip");
    if (dow === 0 || dow === 6) chip.classList.add("we");
    if (key === todayKey) chip.classList.add("today");
    chip.append(
      el("small", "", day.toLocaleDateString("en-GB", { weekday: "short" })),
      el("b", "", String(d))
    );
    row.appendChild(chip);

    CONFIG.buckets.forEach((bucket, i) => row.appendChild(makeCell(infos[i], day, bucket)));
    const holiday = holidays[key];
    if (holiday) {
      const label = el("div", "hol", `Bank holiday · ${holiday}`);
      if (weekGap) label.classList.add("mon");
      body.appendChild(label);
      chip.classList.add("hol-day");
    } else if (weekGap) {
      row.classList.add("mon");
    }
    body.appendChild(row);
  }

  renderQtList(matches, now, busy);
  updateNextUp(busy, matches, now);

  if (pendingScroll) {
    const target = body.querySelector(`[data-date="${pendingScroll}"]`);
    pendingScroll = null;
    if (target) {
      target.scrollIntoView({ block: "center", behavior: reduceMotion() ? "auto" : "smooth" });
    }
  }
}

/* Reads the latest copy of a slot's record, applies a change, and saves it.
   A slot is QT once both people have said yes. */
async function updateMatch(key, change) {
  const ref = doc(db, "matches", key);
  const snap = await getDoc(ref);
  const next = { ...(snap.exists() ? snap.data() : {}) };
  change(next);
  next.status = (next[ME] && next[OTHER]) ? "qt" : "proposed";
  if (!next[ME] && !next[OTHER]) next.plan = "";
  await setDoc(ref, next);
  return next;
}

/* --- Next-up strip: a clash first, then a waiting suggestion, then the first free slot --- */
let clashCount = 0;
function updateNextUp(busy, matches, now) {
  const strip = $("nextUp");
  let clash = null, theirs = null, free = null;
  clashCount = 0;
  const limit = CONFIG.monthsAhead * 31;
  for (let i = 0; i < limit; i++) {
    const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
    for (const bucket of CONFIG.buckets) {
      const info = bucketInfo(day, bucket, busy, matches, now);
      if (info.clash.length) { clashCount++; if (!clash) clash = { day, bucket, info }; }
      if (info.status === "ask-theirs" && !theirs) theirs = { day, bucket };
      if (info.status === "free" && !free) free = { day, bucket };
    }
  }
  const pick = clash || theirs || free;
  if (!pick) { strip.hidden = true; return; }

  strip.hidden = false;
  strip.classList.toggle("alert", !!(clash || theirs));
  $("nextLabel").textContent = clash
    ? (clashCount > 1 ? `${clashCount} booked QTs have a clash` : "A booked QT has a clash")
    : theirs ? `${personLabel(OTHER)} suggested a time` : "Next time you're both free";
  $("nextWhen").textContent = `${shortDate(pick.day)} · ${pick.bucket.label}`;
  $("nextSub").textContent = clash
    ? `Clashes with ${clash.info.clash[0].title || "an event"}. Tap to see it.`
    : `${bucketRange(pick.bucket)}. ${theirs ? "Tap to find it and say yes." : "Tap to find it in the grid."}`;
  strip.onclick = () => {
    viewMonthOffset = (pick.day.getFullYear() - now.getFullYear()) * 12 + pick.day.getMonth() - now.getMonth();
    pendingScroll = dateKey(pick.day);
    renderGrid().then(() => {
      const row = $("gridBody").querySelector(`[data-date="${dateKey(pick.day)}"]`);
      if (row) { row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1800); }
    });
  };
}

window.shiftMonth = function (delta) {
  const next = viewMonthOffset + delta;
  if (next < 0 || next > CONFIG.monthsAhead) return;
  viewMonthOffset = next;
  pendingScroll = null;
  renderGrid();
};

/* =====================================================================
   SLOT DETAIL SHEETS
   ===================================================================== */
function showBusy(info, day, bucket) {

    card.append(el("h3", "", `${shortDate(day)} · ${bucket.label}`));
    card.append(el("p", "sub", `${bucketRange(bucket)}. Busy because of:`));

      row.append(el("span", "av", initialOf(ev.owner)));

        el("div", "t", ev.title || "(no title)"),
        el("div", "w", `${personLabel(ev.owner)} · ${shortDate(ev.start)} ${fmtClock(ev.start)}–${fmtClock(ev.end)}`)
      );
      row.append(text);
      card.append(row);
    });
    const actions = el("div", "actions");
    const close = el("button", "btn ghost", "Close");
    close.onclick = closeSheet;
    actions.append(close);
    card.append(actions);
  });
}

/* One sheet for every slot you can act on: suggest it, answer a suggestion,
   or look after a booked QT. The plan is a shared note either person can edit. */
function showSlot(info, day, bucket) {
  const match = info.match || {};
  const status = info.status;
  const whenShort = `${shortDate(day)}, ${bucket.label.toLowerCase()}`;
  openSheet(card => {
    card.append(el("h3", "", status === "qt" ? "QT booked" : `${shortDate(day)} · ${bucket.label}`));
    const lead = {
      "free": "You're both free.",
      "ask-mine": `You suggested this. Waiting for ${personLabel(OTHER)}.`,
      "ask-theirs": `${personLabel(OTHER)} suggested this.`,
    }[status] || "";
    card.append(el("p", "sub", `${longDate(day)}, ${bucket.label.toLowerCase()} (${bucketRange(bucket)}). ${lead}`.trim()));

    if (info.clash.length) {
      const box = el("div", "clash-box");
      box.append(el("div", "clash-title", "This now clashes with:"));
      [...info.clash].sort((a, b) => a.start - b.start).forEach(ev => box.append(el("div", "",
        `${ev.title || "(no title)"} · ${personLabel(ev.owner)}, ${fmtClock(ev.start)}–${fmtClock(ev.end)}`)));
      card.append(box);
    }

    const field = el("label", "plan-field");
    const area = document.createElement("textarea");
    area.maxLength = 300; area.rows = 3;
    area.value = match.plan || "";
    area.placeholder = "Dinner at ours, a walk, the cinema…";
    field.append(el("span", "", "The plan (optional)"), area);
    card.append(field);
    const plan = () => area.value.trim();

    const act = async (change, message) => {
      try {
        const next = await updateMatch(info.key, change);
        closeSheet();
        toast(typeof message === "function" ? message(next) : message);
      } catch (e) {
        toast("Couldn't save that. Check your connection and try again.");
      }
      renderGrid();
    };
    const actions = el("div", "actions");
    const button = (cls, text, fn) => {
      const b = el("button", cls, text);
      b.type = "button"; b.onclick = fn;
      actions.append(b);
    };

    if (status === "free") {
      button("btn ghost", "Cancel", closeSheet);
      button("btn", "Suggest this time", () => act(
        m => { m[ME] = true; m.plan = plan(); },
        next => (next.status === "qt"
          ? `QT booked for ${whenShort}.`
          : `Suggested ${whenShort}. Waiting for ${personLabel(OTHER)}.`)));
    } else if (status === "ask-mine") {
      button("btn ghost", "Withdraw", () => act(m => { m[ME] = false; }, `Withdrew ${whenShort}.`));
      button("btn", "Save plan", () => act(m => { m.plan = plan(); }, "Plan saved."));
    } else if (status === "ask-theirs") {
      button("btn ghost", "Not now", closeSheet);
      button("btn qt", "Yes, book it", () => act(
        m => { m[ME] = true; m.plan = plan(); },
        `QT booked for ${whenShort}. Download it from the Booked QT list.`));
    } else {
      button("linkbtn", "Cancel this QT", () => {
        if (!confirm(`Cancel QT on ${whenShort}? This cancels it for both of you.`)) return;
        act(m => { m[ME] = false; m[OTHER] = false; m.plan = ""; }, `Cancelled QT on ${whenShort}.`);
      });
      button("btn ghost", "Save plan", () => act(m => { m.plan = plan(); }, "Plan saved."));
      button("btn qt", "Download", () => {
        updateMatch(info.key, m => { m.plan = plan(); }).then(renderGrid).catch(() => {});
        downloadIcs(dateKey(day), bucket, plan());
      });
    }
    card.append(actions);
  });
}

/* =====================================================================
   QT LIST + ICS DOWNLOAD
   ===================================================================== */
function renderQtList(matches, now, busy) {
  const list = $("qtList");
  list.replaceChildren();
  const entries = Object.entries(matches)
    .filter(([, v]) => v.status === "qt")
    .map(([key, v]) => {
      const [dateStr, bucketKey] = key.split("_");
      return { dateStr, bucket: CONFIG.buckets.find(b => b.key === bucketKey), day: parseKey(dateStr), plan: v.plan || "" };
    })
    .filter(x => x.bucket)
    .filter(x => { const end = new Date(x.day); end.setHours(x.bucket.endHour, 0, 0, 0); return end > now; })
    .sort((a, b) => a.day - b.day || a.bucket.startHour - b.bucket.startHour);

  if (!entries.length) {
    list.append(el("p", "empty", "Nothing booked yet. Tap a green slot to suggest it. When you've both said yes to the same one, it turns into QT."));
    return;
  }
  entries.forEach(({ dateStr, bucket, day, plan }) => {
    const info = bucketInfo(day, bucket, busy, matches, now);
    const row = el("div", "qt-row");
    const left = el("div", "qt-text");
    left.append(el("span", "", longDate(day)), el("small", "", `${bucket.label}, ${bucketRange(bucket)}`));
    if (plan) left.append(el("small", "plan", plan));
    if (info.clash.length) {
      left.append(el("small", "clash-note", "Clashes with " +
        info.clash.map(ev => `${ev.title || "an event"} (${personLabel(ev.owner)})`).join(", ")));
    }
    const details = el("button", "linkbtn", "Details");
    details.type = "button";
    details.onclick = () => showSlot(info, day, bucket);
    const btn = el("button", "btn qt small", "Download");
    btn.type = "button";
    btn.onclick = () => downloadIcs(dateStr, bucket, plan);
    row.append(left, details, btn);
    list.append(row);
  });
}

function downloadIcs(dateStr, bucket, plan = "") {
  const day = parseKey(dateStr);
  const start = new Date(day); start.setHours(bucket.startHour, 0, 0, 0);
  const end = new Date(day); end.setHours(bucket.endHour, 0, 0, 0);
  const fmt = (d) => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const text = (t) => t.replace(/([\;,])/g, "\\$1").replace(/\r?\n/g, "\\n");
  const firstLine = plan.split(/\r?\n/)[0].slice(0, 60);
  // The name always starts with "QT", which is how a later calendar sync
  // recognises this entry as the plan itself and not something clashing with it.
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//q-time-planner//EN", "BEGIN:VEVENT",
    `UID:${dateStr}-${bucket.key}@q-time-planner`,
    `DTSTAMP:${fmt(new Date())}`,
    `DTSTART:${fmt(start)}`, `DTEND:${fmt(end)}`,
    `SUMMARY:${text(firstLine ? `QT: ${firstLine}` : "QT")}`,
  ];
  if (plan) lines.push(`DESCRIPTION:${text(plan)}`);
  lines.push("END:VEVENT", "END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `qt-${dateStr}.ics`;
  a.click();
}

/* =====================================================================
   KIDS DAYS
   A tap-to-set calendar of the days this person has their kids, for
   patterns that change week to week and don't suit a repeating event.
   A day can be all day, morning only, or afternoon and evening (for
   handover days). Each is stored as a "kids" event with source "manual",
   so it shows on the planner as that person's kids badge on the slots it
   covers, is never touched by a calendar sync, and stays out of My events.
   The same screen compares those days with the "Free, kids with me"
   events in the person's synced calendars, and can download the days
   as calendar entries.
   ===================================================================== */
const KID_TITLE_KEY = `meetup-kids-title-${ME}`;
const kidsTitle = () => (localStorage.getItem(KID_TITLE_KEY) || "").trim() || "Kids with me";
const kidDayId = (key) => `kidday-${key}`;
// Handover point: where the first slot (morning) ends.
const KID_FIRST_HOUR = Math.min(...CONFIG.buckets.map(b => b.startHour));
const KID_SPLIT_HOUR = CONFIG.buckets[0].endHour;
const KID_LAST_HOUR = Math.max(...CONFIG.buckets.map(b => b.endHour));
const KID_PARTS = [
  ["all", "All day"],
  ["am", "Morning"],
  ["pm", "Afternoon & evening"],
];
const KID_WORDS = { all: "all day", am: "morning only", pm: "afternoon and evening" };
const kidWords = (part) => KID_WORDS[part] || "nothing";

function kidDayDoc(key, part) {
  const day = parseKey(key);
  const at = (h) => new Date(day.getFullYear(), day.getMonth(), day.getDate(), h);
  const start = part === "pm" ? at(KID_SPLIT_HOUR) : at(0);
  const end = part === "am" ? at(KID_SPLIT_HOUR) : at(24);
  return { title: kidsTitle(), start: start.toISOString(), end: end.toISOString(), tag: "kids", source: "manual", day: key, part };
}

async function openKidsDays() {
  const manual = new Map(); // day -> "all" | "am" | "pm"
  const fromCalendar = [];
  try {
    const snap = await getDocs(collection(db, `people/${ME}/events`));
    snap.forEach(d => {
      const e = d.data();
      if (e.tag !== "kids") return;
      if (e.source === "manual") manual.set(e.day || d.id.replace(/^kidday-/, ""), e.part || "all");
      else fromCalendar.push({ start: new Date(e.start), end: new Date(e.end) });
    });
  } catch (e) {
    toast("Couldn't load your days. Check your connection and try again.");
    return;
  }

  const now = new Date();
  const todayKey = dateKey(now);
  // What the synced calendar says for a day, judged on the slots it covers.
  const covers = (day, fromHour, toHour) => {
    const a = new Date(day); a.setHours(fromHour, 0, 0, 0);
    const b = new Date(day); b.setHours(toHour, 0, 0, 0);
    return fromCalendar.some(iv => iv.start < b && iv.end > a);
  };
  const calendarPart = (day) => {
    const am = covers(day, KID_FIRST_HOUR, KID_SPLIT_HOUR);
    const pm = covers(day, KID_SPLIT_HOUR, KID_LAST_HOUR);
    return am && pm ? "all" : am ? "am" : pm ? "pm" : null;
  };
  let offset = 0;
  let brush = "all";

  openSheet(card => {
    card.style.setProperty("--kid", `var(--kid-${Math.max(0, CONFIG.people.findIndex(p => p.id === ME))})`);
    card.append(el("h3", "", "Days I have the kids"));
    card.append(el("p", "sub", "Pick what a tap sets, then tap the days. Tap a day again to clear it. Each tap saves straight away."));

    const seg = el("div", "seg");
    seg.setAttribute("role", "group");
    seg.setAttribute("aria-label", "A tap sets");
    const segButtons = KID_PARTS.map(([part, text]) => {
      const b = el("button", "", text);
      b.type = "button";
      b.onclick = () => { brush = part; refresh(); };
      seg.append(b);
      return [part, b];
    });
    card.append(seg);

    const nav = el("div", "monthnav");
    const prev = el("button", "round", "‹"); prev.type = "button"; prev.setAttribute("aria-label", "Previous month");
    const label = el("h2");
    const next = el("button", "round", "›"); next.type = "button"; next.setAttribute("aria-label", "Next month");
    nav.append(prev, label, next);
    const grid = el("div", "kd-grid");
    const key = el("p", "kd-key");
    const diffBox = el("div", "kd-diff");
    card.append(nav, grid, key, diffBox);

    const field = el("label", "kd-field");
    const input = document.createElement("input");
    input.type = "text"; input.maxLength = 60; input.value = kidsTitle();
    input.onchange = () => localStorage.setItem(KID_TITLE_KEY, input.value.trim());
    field.append(el("span", "", "Name for the entries in your calendar"), input);
    card.append(field);

    const actions = el("div", "actions");
    const download = el("button", "btn ghost", "Download for my calendar"); download.type = "button";
    const done = el("button", "btn", "Done"); done.type = "button";
    done.onclick = closeSheet;
    actions.append(download, done);
    card.append(actions);

    async function setDay(dayKey, part) {
      const before = manual.get(dayKey) || null;
      if (part) manual.set(dayKey, part); else manual.delete(dayKey);
      refresh();
      try {
        await commitWrites([[doc(db, `people/${ME}/events/${kidDayId(dayKey)}`), part ? kidDayDoc(dayKey, part) : null]]);
        renderGrid();
      } catch (e) {
        if (before) manual.set(dayKey, before); else manual.delete(dayKey);
        refresh();
        toast("Couldn't save that day. Check your connection and try again.");
      }
    }

    function refresh() {
      segButtons.forEach(([part, b]) => {
        b.classList.toggle("on", part === brush);
        b.setAttribute("aria-pressed", String(part === brush));
      });
      const month = new Date(now.getFullYear(), now.getMonth() + offset, 1);
      label.textContent = month.toLocaleString("en-GB", { month: "long", year: "numeric" });
      prev.disabled = offset <= 0;
      next.disabled = offset >= CONFIG.monthsAhead;
      const compare = fromCalendar.length > 0;

      grid.replaceChildren();
      ["M", "T", "W", "T", "F", "S", "S"].forEach(d => grid.append(el("div", "kd-wd", d)));
      for (let i = 0; i < (month.getDay() + 6) % 7; i++) grid.append(el("div"));
      const days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
      for (let d = 1; d <= days; d++) {
        const day = new Date(month.getFullYear(), month.getMonth(), d);
        const dayKey = dateKey(day);
        const here = manual.get(dayKey) || null;
        const cal = compare ? calendarPart(day) : null;
        const b = el("button", "kd-day", String(d));
        b.type = "button";
        b.dataset.day = dayKey;
        if (here) b.classList.add(`on-${here}`);
        if (cal) b.classList.add("cal");
        if (compare && here !== cal && dayKey >= todayKey) b.classList.add("diff");
        if (dayKey < todayKey) b.disabled = true;
        b.setAttribute("aria-label", `${longDate(day)}: ${here ? `kids with me ${kidWords(here)}` : "not set"}` +
          (compare ? `; synced calendar has ${kidWords(cal)}` : ""));
        b.onclick = () => setDay(dayKey, here === brush ? null : brush);
        grid.append(b);
      }

      key.textContent = "Filled: all day. Band at the top: morning only. Band at the bottom: afternoon and evening." +
        (compare ? " Dot: in your synced calendar. Amber outline: the two disagree." : "");

      diffBox.replaceChildren();
      diffBox.append(el("h4", "", "Compared with your synced calendar"));
      if (!compare) {
        diffBox.append(el("p", "empty",
          "Nothing in your synced calendar is marked \"Free, kids with me\" yet, so there's nothing to compare. " +
          "Download these days into your calendar and sync, and they'll be matched up here."));
        return;
      }
      const diffs = [];
      for (let i = 0; i <= CONFIG.monthsAhead * 31; i++) {
        const day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
        const dayKey = dateKey(day);
        const here = manual.get(dayKey) || null, cal = calendarPart(day);
        if (here !== cal) diffs.push({ day, dayKey, here, cal });
      }
      if (!diffs.length) {
        diffBox.append(el("p", "empty", "They match. Every day set here is in your calendar, and the other way round."));
        return;
      }
      diffBox.append(el("p", "empty", `${diffs.length} ${diffs.length === 1 ? "day doesn't" : "days don't"} match.`));
      diffs.slice(0, 14).forEach(({ day, dayKey, here, cal }) => {
        const line = el("div", "kd-line");
        line.append(el("span", "", `${shortDate(day)}: here ${kidWords(here)}, calendar ${kidWords(cal)}`));
        const fix = el("button", "linkbtn", "Use calendar's");
        fix.type = "button";
        fix.onclick = () => setDay(dayKey, cal);
        line.append(fix);
        diffBox.append(line);
      });
      if (diffs.length > 14) diffBox.append(el("p", "empty", `…and ${diffs.length - 14} more further ahead.`));
    }

    prev.onclick = () => { offset--; refresh(); };
    next.onclick = () => { offset++; refresh(); };
    download.onclick = () => {
      const keys = [...manual.keys()].filter(k => k >= todayKey).sort();
      if (!keys.length) { toast("No days are set yet."); return; }
      const title = kidsTitle();
      const esc = (t) => t.replace(/([\\;,])/g, "\\$1");
      const ymd = (d) => dateKey(d).replace(/-/g, "");
      const utc = (d) => d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
      const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//q-time-planner//EN"];
      keys.forEach(k => {
        const day = parseKey(k);
        const at = (h) => new Date(day.getFullYear(), day.getMonth(), day.getDate(), h);
        const part = manual.get(k);
        // The same day always gets the same UID, so adding the file again
        // updates the entry instead of duplicating it.
        lines.push("BEGIN:VEVENT", `UID:kidday-${k}-${ME}@q-time-planner`, `DTSTAMP:${utc(new Date())}`);
        if (part === "all") {
          lines.push(`DTSTART;VALUE=DATE:${ymd(day)}`, `DTEND;VALUE=DATE:${ymd(at(24))}`);
        } else {
          const from = part === "am" ? KID_FIRST_HOUR : KID_SPLIT_HOUR;
          const to = part === "am" ? KID_SPLIT_HOUR : KID_LAST_HOUR;
          lines.push(`DTSTART:${utc(at(from))}`, `DTEND:${utc(at(to))}`);
        }
        lines.push(`SUMMARY:${esc(title)}`, "TRANSP:TRANSPARENT", "END:VEVENT");
      });
      lines.push("END:VCALENDAR");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([lines.join("\r\n")], { type: "text/calendar" }));
      a.download = "kids-days.ics";
      a.click();
      // When these entries come back through a calendar sync, recognise them
      // as kids days without asking.
      commitWrites([[doc(db, `people/${ME}/rules/${titleRule(title)}`), { tag: "kids" }]]).catch(() => {});
      toast(`${keys.length} ${keys.length === 1 ? "day" : "days"} ready to add to your calendar.`);
    };

    refresh();
  });
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot() {
  const who = $("whoAmIRow");
  who.replaceChildren();
  const sw = el("button", "", "Not you?");
  sw.type = "button";
  sw.onclick = () => { localStorage.removeItem("meetup-person-id"); location.reload(); };
  who.append(el("span", "av", initialOf(ME)), el("span", "", personLabel(ME)), sw);
  renderConnectRow();
  renderKidsLegend();
  showReviewBanner();
  readCachedHolidays();
  renderGrid().then(autoSync);
  refreshHolidays().then(changed => { if (changed) renderGrid(); });
}
